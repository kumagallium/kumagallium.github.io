name: Fetch CMS Data

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 0 * * *'  # 毎日UTC 0時に実行
  workflow_dispatch:  # 手動実行も可能

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      # Notion をヘッドレス CMS として使い、業績データを取得する
      - name: Fetch Notion data
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python scripts/fetch_notion.py

      # OSS アクティビティを取得する。
      # トークンは CI 内でのみ使われ、生成される JSON には含まれない。
      # コントリビューション統計（GraphQL）は GITHUB_TOKEN では取得できないため、
      # スコープなしの PAT を GH_STATS_TOKEN として登録しておくと草・年別集計まで出る。
      - name: Fetch GitHub data
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || github.token }}
        run: python scripts/fetch_github.py

      - name: Commit and push if data changed
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/notion_data.json data/github_data.json
          git diff --staged --quiet || git commit -m "chore: update CMS data"
          git push
